name: Lambda Manager — Unit Tests (Per PR)

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-22.04

    # Add the Redis service container
    services:
      redis:
        image: redis:alpine
        # Map BOTH ports to the container's internal 6379 port
        ports:
          - 6379:6379
          - 6666:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Start Open Policy Agent (OPA)
        run: |
          # Boot standard OPA and point it to the root apps directory
          docker run -d --network host --name opa \
            -v ${{ github.workspace }}:/workspace \
            openpolicyagent/opa:0.45.0 \
            run --server /workspace/cvat/apps

          echo "Waiting for OPA to boot and compile rules on port 8181..."
          
          # Poll the health endpoint
          for i in {1..15}; do
            if curl -s http://localhost:8181/health > /dev/null; then
              echo "✅ OPA is up and running!"
              exit 0
            fi
            echo "Waiting..."
            sleep 2
          done
          
          # If the loop finishes without exiting 0, OPA failed. Dump the logs!
          echo "❌ OPA failed to start! Dumping container logs for debugging:"
          docker logs opa
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgeos-dev \
            libldap2-dev \
            libsasl2-dev
          
      - name: Install dependencies
        run: |
          pip install -r cvat/requirements/testing.txt
          pip install pytest pytest-django pytest-cov pytest-rerunfailures bandit djangorestframework

      - name: Run Bandit static analysis
        run: |
          bandit -r cvat/apps/lambda_manager/views.py \
                    cvat/apps/lambda_manager/serializers.py \
                 -ll --exit-zero

      - name: Run unit tests with coverage
        run: |
          pytest cvat/apps/lambda_manager/tests/test_groupk_lambda.py \
                 -v --tb=short
        env:
          DJANGO_SETTINGS_MODULE: cvat.settings.testing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
