name: Lambda Manager — Unit Tests (Per PR)

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-22.04

    # Add the Redis service container
    services:
      redis:
        image: redis:alpine
        # Map BOTH ports to the container's internal 6379 port
        ports:
          - 6379:6379
          - 6666:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

     # ---> UPDATED OPA CONTAINER STEP <---
      - name: Start Open Policy Agent (OPA)
        run: |
          # 1. Dynamically find all 'rules' directories in the repo and map them to the container path
          RULES_DIRS=$(find cvat/apps -type d -name "rules" | sed 's|^|/workspace/|')
          
          # 2. Boot standard OPA to avoid GitHub Actions volume permission conflicts
          docker run -d --network host --name opa \
            -v ${{ github.workspace }}:/workspace \
            openpolicyagent/opa:0.45.0 \
            run --server $RULES_DIRS
      # ------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgeos-dev \
            libldap2-dev \
            libsasl2-dev
          
      - name: Install dependencies
        run: |
          pip install -r cvat/requirements/testing.txt
          pip install pytest pytest-django pytest-cov pytest-rerunfailures bandit djangorestframework

      - name: Run Bandit static analysis
        run: |
          bandit -r cvat/apps/lambda_manager/views.py \
                    cvat/apps/lambda_manager/serializers.py \
                 -ll --exit-zero

      - name: Run unit tests with coverage
        run: |
          pytest cvat/apps/lambda_manager/tests/test_groupk_lambda.py \
                 -v --tb=short
        env:
          DJANGO_SETTINGS_MODULE: cvat.settings.testing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
