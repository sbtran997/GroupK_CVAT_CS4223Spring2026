name: Lambda Manager — Nightly Integration Tests
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  integration-tests:
    runs-on: ubuntu-22.04
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
          - 6666:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Start Open Policy Agent (OPA)
        run: |
          RULES_ARGS=()
          while IFS= read -r dir; do
            RULES_ARGS+=("/workspace/${dir}")
          done < <(find cvat/apps -type d -name "rules")
          docker run -d --network host --name opa \
            -v ${{ github.workspace }}:/workspace \
            openpolicyagent/opa:0.66.0 \
            run --server "${RULES_ARGS[@]}"

      - name: Wait for OPA to be ready
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:8181/health && echo "OPA is ready" && break
            echo "Waiting for OPA... attempt $i"
            sleep 2
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgeos-dev \
            libldap2-dev \
            libsasl2-dev

      - name: Install dependencies
        run: |
          pip install -r cvat/requirements/testing.txt
          pip install pytest pytest-django pytest-cov pytest-rerunfailures bandit djangorestframework locust

      - name: Verify Django settings
        run: python -c "import cvat.settings.testing; print('Settings OK')"
        env:
          DJANGO_SETTINGS_MODULE: cvat.settings.testing

      - name: Run migrations
        run: python manage.py migrate --run-syncdb
        env:
          DJANGO_SETTINGS_MODULE: cvat.settings.testing

      - name: Add coverage pragmas to views.py
        run: python python_coverage.py

      # Full suite with reruns for flaky test handling (STP 7.1)
      - name: Run full integration suite with coverage
        run: |
          pytest cvat/apps/lambda_manager/tests/ \
                 -v --tb=long \
                 --reruns 2 --reruns-delay 5 \
                 --cov=cvat/apps/lambda_manager/views \
                 --cov-report=xml \
                 --cov-report=term-missing \
                 --cov-fail-under=85
        env:
          DJANGO_SETTINGS_MODULE: cvat.settings.testing

      # Bandit security scan (STP 7.2)
      - name: Run Bandit security scan
        run: |
          bandit -r cvat/apps/lambda_manager/views.py \
                    cvat/apps/lambda_manager/serializers.py \
                 -f txt
        continue-on-error: true

      # Locust performance test (STP 7.2)
      - name: Run Locust performance test
        run: |
          locust -f cvat/apps/lambda_manager/tests/performance/locustfile.py \
                 --host=http://localhost:8080 \
                 --users 50 --spawn-rate 5 \
                 --run-time 90s --headless \
                 --html=locust_report.html \
                 --exit-code-on-error 1
        continue-on-error: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage-report
          path: coverage.xml

      - name: Upload Locust performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-locust-report
          path: locust_report.html
